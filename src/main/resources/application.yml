spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:C:/Users/takes/db-recuperacao-pj;AUTO_SERVER=TRUE;CACHE_SIZE=1024
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # Atualiza a estrutura do banco automaticamente
  cache:
    type: SIMPLE
    cache-names: jwtCache

jwt:
  secret: c2VjcmV0a2V5c2VjdXJlZG5vdGV4ZW5jb2RlcnZhbHVlMzJkZGVkZmFjZGll

logging:
  level:
    org.springframework.security: DEBUG

