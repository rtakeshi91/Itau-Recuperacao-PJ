spring.application.name=itau-pj-recuperacao

spring.datasource.url=jdbc:mysql://localhost:3306/itau-pj-recuperacao?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway (para rodar as migrations automaticamente)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true